<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inferval — architecture</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121212;
        --panel: #191919;
        --panel-2: #1e1e1e;
        --line: #424242;
        --soft: #2b2b2b;
        --text: #f1f1f1;
        --muted: #999;
        --faint: #6f6f6f;
        --green: #5bd39a;
        --blue: #6aafff;
        --yellow: #e7bb62;
        --sans: "Instrument Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
        --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
      }

      body { display: grid; grid-template-rows: 64px minmax(0, 1fr); }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        border-bottom: 1px solid var(--soft);
      }

      .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.025em; }
      .brand svg { width: 20px; color: var(--muted); }
      .meta { color: var(--faint); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }

      main { min-height: 0; display: grid; place-items: center; padding: 14px 20px 20px; }
      .canvas { width: 100%; height: 100%; max-width: 1580px; border: 1px solid var(--soft); border-radius: 16px; background: #111; }
      svg { display: block; width: 100%; height: 100%; }

      .group-box { fill: #141414; stroke: #303030; stroke-width: 1; }
      .group-label { fill: var(--faint); font: 600 10px var(--mono); letter-spacing: .12em; }
      .group-logo { fill: #575757; }

      .node .shell { fill: var(--panel); stroke: #3a3a3a; stroke-width: 1; }
      .node .accent { fill: var(--accent, #555); }
      .node.platform { --accent: var(--blue); }
      .node.policy { --accent: var(--green); }
      .node.agent { --accent: var(--yellow); }
      .node .icon-bg { fill: var(--panel-2); stroke: var(--soft); }
      .node .logo { fill: var(--text); }
      .node .logo-muted { fill: var(--muted); }
      .node-title { fill: var(--text); font: 620 15px var(--sans); letter-spacing: -.02em; }
      .node-sub { fill: var(--muted); font: 10px var(--sans); }
      .node-tech { fill: var(--faint); font: 8px var(--mono); letter-spacing: .03em; }

      .edge { fill: none; stroke: var(--line); stroke-width: 1.5; marker-end: url(#arrow); }
      .edge.platform { stroke: var(--blue); opacity: .7; }
      .edge.policy { stroke: var(--green); opacity: .78; }
      .edge.agent { stroke: var(--yellow); opacity: .8; }
      .edge.data { stroke: #555; stroke-dasharray: 4 5; opacity: .7; }
      .edge-label rect { fill: #111; }
      .edge-label text { fill: var(--faint); font: 8px var(--mono); }

      .mini-pill { fill: #1d1d1d; stroke: #353535; }
      .mini-text { fill: var(--muted); font: 9px var(--mono); }
      .protocol { fill: var(--text); font: 600 10px var(--mono); letter-spacing: .08em; }

      @media (prefers-reduced-motion: no-preference) {
        .edge.agent { stroke-dasharray: 7 5; animation: flow 12s linear infinite; }
      }
      @keyframes flow { to { stroke-dashoffset: -48; } }

      @media (max-width: 800px) {
        header { padding: 0 16px; }
        .meta { display: none; }
        main { padding: 8px; }
        .canvas { border-radius: 10px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 14 16.5 9.5"/><path d="M20.3 15a9 9 0 1 0-16.6 0"/><path d="M4 19h16"/>
        </svg>
        <span>inferval</span>
      </div>
      <div class="meta">system architecture</div>
    </header>

          <text class="node-tech" x="1450" y="123" text-anchor="end">CPU CONTROL + ISOLATED GPU</text>

          <path class="edge platform" d="M330 231 H420"/>
          <path class="edge" d="M574 231 H618"/>
